name: YouTube Charts - SOLO PRUEBAS

# SOLO PRUEBAS: repo youtube-music-charts-intelligence
# 1.py esta en scripts/
# Workflow en .github/workflows/test.yml
# No hay schedule, no hay auto-commit, no hay push.

on:
  workflow_dispatch:
    inputs:
      chart:
        description: 'Chart a probar'
        required: false
        default: 'TopSongs'
      country:
        description: 'Pais a probar'
        required: false
        default: 'global'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (solo lectura, modo pruebas)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install xvfb (DISPLAY virtual para que Chrome crea que hay ventana)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install deps (SOLO requirements-ci.txt, NO requirements.txt completo)
        run: |
          python -m pip install --upgrade pip
          # 1.py solo necesita playwright. requirements.txt completo instala ~50 paquetes (openai, groq, selenium, jupyter, scipy...) y pip hace backtracking con google-api-core.
          # Por eso en CI NUNCA usar requirements.txt.
          test -f requirements-ci.txt || (echo "ERROR: falta requirements-ci.txt en la raiz, subelo" && exit 1)
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Verificar que 1.py tiene --terminal
        run: |
          python3 scripts/1.py --help | grep -q "\-\-terminal" && echo "OK: 1.py tiene --terminal" || (echo "ERROR: 1.py viejo sin --terminal, sube el 1.py nuevo a scripts/1.py" && exit 1)
          grep -q "Modo TERMINAL + DISPLAY" scripts/1.py && echo "OK: 1.py nuevo, --terminal NO es headless" || (echo "ERROR: 1.py viejo donde --terminal = headless, sube el 1.py nuevo" && exit 1)
          echo "DISPLAY en CI (sin xvfb aun): [$DISPLAY]"

      - name: Test scraper en MODO TERMINAL
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          # 1.py ahora vive en scripts/
          # xvfb-run -a OBLIGATORIO en CI: sin DISPLAY, headless puro -> Polymer no hidrata -> links=0 / bodyLen=0
          xvfb-run -a python3 scripts/1.py --terminal --use-chrome --country ${{ inputs.country }} --chart ${{ inputs.chart }} --force
          echo "--- RESULTADO PRUEBA ---"
          ls -lh charts_archive/1_download-chart/latest_chart.csv || ls -lh *.csv || echo "NO se genero CSV"
          wc -l charts_archive/1_download-chart/latest_chart.csv || true
          head -n 5 charts_archive/1_download-chart/latest_chart.csv || true

      - name: Subir CSV + log como artifact (no commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-chart-${{ github.run_id }}
          path: |
            charts_archive/1_download-chart/latest_chart.csv
            logs/
          if-no-files-found: warn
          retention-days: 7
