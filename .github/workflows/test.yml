name: YouTube Charts Scraper

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas
          playwright install chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python scripts/1.py --terminal --wait 90 --min-rows 50
        # NOTA: NO uses --use-chrome en GitHub (no esta instalado).
        # NOTA: SIEMPRE con xvfb-run (si no, --terminal = headless = captcha).

      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts_archive/ logs/
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "charts: update $(date +%G-W%V)"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: logs/debug/
          if-no-files-found: ignore
