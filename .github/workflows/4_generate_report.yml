# .github/workflows/test-report-generator.yml
#
# Manual-only workflow to validate the 4_report_generator package and
# publish the resulting notebooks into the repository.
#
# Pipeline:
#   1. Checkout repo
#   2. Set up Python
#   3. Install dependencies
#   4. List enriched DBs (sanity check)
#   5. Generate notebooks (no outputs yet, just cells)
#   6. Execute notebooks in place (renders charts and tables into outputs)
#   7. Enforce retention: keep only 4 most recent notebooks per language
#   8. Commit and push if anything changed
#
# Retention policy: only the 4 most recent notebooks per language are
# kept under notebook_en/weekly/ and notebook_es/weekly/. Older ones are
# removed before committing, so the repository does not grow unbounded.
#
# The generator itself (main.py) does not execute the notebooks; it only
# emits them. Execution is done here with `nbconvert --execute` so the
# committed `.ipynb` files contain the rendered charts.

name: Test Report Generator

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language(s) to generate"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - en
          - es
      week:
        description: "Optional ISO week (e.g. 2026-W46). Leave empty for latest."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------------
      # 1. Checkout the repository
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. Set up Python
      # ----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------------------------
      # 3. Install dependencies (generator + notebook execution)
      # ----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas numpy matplotlib seaborn squarify scipy nbformat pyyaml \
            jupyter nbconvert

      # ----------------------------------------------------------------------
      # 4. Sanity check: list the enriched DBs visible to the runner
      # ----------------------------------------------------------------------
      - name: List enriched DBs
        run: |
          echo "Archive directory: charts_archive/3_enrich-chart-data"
          ls -la charts_archive/3_enrich-chart-data/ | head -50

      # ----------------------------------------------------------------------
      # 5. Generate notebooks (cells only, no outputs yet)
      # ----------------------------------------------------------------------
      - name: Generate notebooks
        run: |
          python scripts/4_report_generator/main.py \
            --language "${{ inputs.language }}" \
            ${{ inputs.week != '' && format('--week {0}', inputs.week) || '' }}

      # ----------------------------------------------------------------------
      # 6. Execute notebooks in place so they contain rendered outputs
      # ----------------------------------------------------------------------
      - name: Execute notebooks
        run: |
          set -e
          shopt -s nullglob
          notebooks=(notebook_en/weekly/*.ipynb notebook_es/weekly/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks found to execute."
            exit 1
          fi
          for nb in "${notebooks[@]}"; do
            echo "Executing $nb"
            jupyter nbconvert \
              --to notebook \
              --execute \
              --inplace \
              --ExecutePreprocessor.timeout=300 \
              "$nb"
          done

      # ----------------------------------------------------------------------
      # 7. Enforce retention: keep only the 4 most recent per language
      # ----------------------------------------------------------------------
      - name: Prune old notebooks (keep 4 most recent per language)
        run: |
          for lang in en es; do
            dir="notebook_${lang}/weekly"
            [ -d "$dir" ] || continue
            ls -1 "$dir"/youtube_charts_*.ipynb 2>/dev/null \
              | while read -r f; do
                  base=$(basename "$f")
                  y=$(echo "$base" | sed -E 's/^youtube_charts_([0-9]{4})-W([0-9]+)\.ipynb$/\1/')
                  w=$(echo "$base" | sed -E 's/^youtube_charts_([0-9]{4})-W([0-9]+)\.ipynb$/\2/')
                  echo "$y $w $f"
                done \
              | sort -k1,1n -k2,2n -r \
              | awk 'NR>4 {print $3}' \
              | xargs -r rm -f
            echo "Remaining in $dir:"
            ls -1 "$dir" || true
          done

      # ----------------------------------------------------------------------
      # 8. Commit and push if anything changed
      # ----------------------------------------------------------------------
      - name: Commit notebooks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebook_en notebook_es
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(report): update weekly notebooks ($(date -u +%Y-W%V))"
            git push
          fi
