name: 2.1 - Update Artist Database

on:
  schedule:
    - cron: '0 13 * * 1'  # Lunes a las 13:00 UTC (1 hora después del Script 1)
  
  workflow_dispatch:

env:
  RETENTION_DAYS: 30
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-artist-database:
    name: Build and Update Artist Database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    permissions:
      contents: write
    
    steps:
    - name: 📚 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        pip install -r requirements.txt

    - name: 📁 Ensure directory structure
      run: |
        mkdir -p charts_archive/1_download-chart/databases
        mkdir -p charts_archive/2_1.countries-genres-artist

    - name: 🔑 Check AI API Keys
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        META_API_KEY: ${{ secrets.META_API_KEY }}
      run: |
        echo "🔍 Checking AI API Keys..."
        if [ -z "$DEEPSEEK_API_KEY" ]; then echo "::warning::DEEPSEEK_API_KEY is not set - DeepSeek fallback will be disabled"; else echo "✅ DEEPSEEK_API_KEY is set"; fi
        if [ -z "$GROQ_API_KEY" ]; then echo "::warning::GROQ_API_KEY is not set - Groq fallback will be disabled"; else echo "✅ GROQ_API_KEY is set"; fi
        if [ -z "$META_API_KEY" ]; then echo "::warning::META_API_KEY is not set - Muse Spark fallback will be disabled"; else echo "✅ META_API_KEY is set"; fi

    - name: 🚀 Build artist database (modular)
      timeout-minutes: 50
      run: |
        python -m scripts.2_1_country_genre
      env:
        GITHUB_ACTIONS: true
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        META_API_KEY: ${{ secrets.META_API_KEY }}
        META_REASONING_EFFORT: high

    - name: ✅ Verify database integrity
      run: |
        echo "📊 Verifying artist database..."
        DB_PATH="charts_archive/2_1.countries-genres-artist/artist_countries_genres.db"
        
        echo "📂 Directory contents:"
        ls -la charts_archive/2_1.countries-genres-artist/
        
        if [ -f "$DB_PATH" ]; then
          SIZE=$(stat -c%s "$DB_PATH")
          echo "✅ Database found: $((SIZE / 1024)) KB"
          
          if command -v sqlite3 &> /dev/null; then
            echo "🔍 Checking database integrity..."
            sqlite3 "$DB_PATH" "PRAGMA integrity_check;"
          fi
        else
          echo "❌ Database not found!"
          exit 1
        fi

    # always(): Si el build se corta por timeout, el progreso se guarda igual.
    - name: 📤 Commit and push changes
      if: always()
      run: |
        echo "📝 Preparing commit..."
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add charts_archive/2_1.countries-genres-artist/
        
        if git diff --cached --quiet; then
          echo "🔭 No changes to commit"
        else
          DATE=$(date +'%Y-%m-%d')
          WEEK=$(python3 -c "from datetime import datetime; y,w,_ = datetime.now().isocalendar(); print(f'{y}-W{w:02d}')")
          git commit -m "🤖 Update artist database ${DATE} (Week ${WEEK}) [Automated]"
          
          echo "⬇️ Pulling latest changes with rebase..."
          git pull --rebase --autostash origin main || true
          
          echo "⬆️ Pushing changes to repository..."
          git push origin HEAD:main
          echo "✅ Changes pushed successfully"
        fi

    - name: 📦 Upload debug artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: artist-db-debug-${{ github.run_number }}
        path: |
          charts_archive/2_1.countries-genres-artist/
        retention-days: 7
        if-no-files-found: ignore

    - name: 📋 Generate final report
      if: always()
      run: |
        echo "========================================"
        echo "🎵 FINAL EXECUTION REPORT"
        echo "========================================"
        echo "📅 Date: $(date)"
        echo "📌 Trigger: ${{ github.event_name }}"
        echo "🔗 Commit: ${{ github.sha }}"
        echo "🧠 AI Cascade: DeepSeek -> Groq -> Muse Spark (high)"
        echo ""
        
        if [ "${{ job.status }}" != "success" ]; then
          echo "❌ Job failed before completing. Check previous steps."
          exit 0
        fi

        DB_FILE="charts_archive/2_1.countries-genres-artist/artist_countries_genres.db"
        if [ -f "$DB_FILE" ]; then
          SIZE=$(stat -c%s "$DB_FILE")
          echo "✅ Artist database: $((SIZE / 1024)) KB"
          
          if command -v sqlite3 &> /dev/null; then
            ARTIST_COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM artist;" 2>/dev/null || echo "N/A")
            UNKNOWN_COUNT=$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM artist WHERE country = 'Unknown' OR macro_genre IS NULL OR macro_genre = 'Unknown';" 2>/dev/null || echo "N/A")
            echo "👤 Artists processed: ${ARTIST_COUNT}"
            echo "❓ Artists with missing info: ${UNKNOWN_COUNT}"
          fi
        else
          echo "⚠️ Artist database not found"
        fi
        
        echo ""
        echo "✅ Process completed"
        echo "========================================"
